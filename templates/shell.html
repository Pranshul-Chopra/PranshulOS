<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PranshulOS</title>
  <link rel="stylesheet" href="/static/fonts/ibmflex.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:          #111110;
      --surface:     #1a1918;
      --surface2:    #222120;
      --border:      #2e2c2a;
      --border2:     #3a3835;
      --text:        #edeae4;
      --text2:       #9b9690;
      --text3:       #5c5955;
      --amber:       #e8a84c;
      --amber-dim:   #7a5820;
      --amber-faint: rgba(232,168,76,0.08);
      --amber-faint2:rgba(232,168,76,0.16);
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans', sans-serif;
    }
    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: var(--sans); -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ── App shell: sidebar + main ── */
    .app {
      display: flex;
      height: 100vh;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 188px;
      flex-shrink: 0;
      background: #0f0f0e;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .sb-logo {
      padding: 22px 18px 16px;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--amber);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sb-nav {
      padding: 12px 10px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .sb-section {
      padding: 14px 8px 6px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      color: var(--text3);
      text-transform: uppercase;
    }
    .sb-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text2);
      font-family: var(--sans);
      font-size: 14px;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s;
      line-height: 1.3;
    }
    .sb-btn:hover { background: var(--surface2); color: var(--text); }
    .sb-btn.active { background: var(--surface2); color: var(--amber); }
    .sb-btn .sb-icon { font-size: 15px; flex-shrink: 0; opacity: 0.75; }
    .sb-btn.active .sb-icon { opacity: 1; }
    .sb-ver {
      padding: 12px 18px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text3);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      letter-spacing: 0.04em;
    }

    /* ── Main content area ── */
    .main {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #content {
      flex: 1;
      overflow: auto;
      height: 100%;
      display: flex;
      flex-direction: column;
      scrollbar-width: thin;
      scrollbar-color: var(--border2) transparent;
    }
    #content::-webkit-scrollbar { width: 3px; height: 3px; }
    #content::-webkit-scrollbar-track { background: transparent; }
    #content::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 999px; }
    #content > div {
      flex: 1;
      min-height: 0;
    }

    /* ── Page transition ── */
    .fade-in { animation: fadeIn 0.15s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* ── Chibi Mascot ── */
    #chibi-mascot {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      user-select: none;
      width: 200px;
      height: 150px;

      /* default: hidden below bottom-left corner */
      left: 20px;
      bottom: -160px;
      transition: none;
    }

    #chibi-mascot.chibi-slide-up {
      animation: chibiSlideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    #chibi-mascot.chibi-slide-down {
      animation: chibiSlideDown 0.4s ease-in forwards;
    }
    #chibi-mascot.chibi-drop-in {
      animation: chibiDropIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    #chibi-mascot.chibi-drop-out {
      animation: chibiDropOut 0.4s ease-in forwards;
    }

    @keyframes chibiSlideUp {
      from { bottom: -160px; left: 20px; }
      to   { bottom: 38px;   left: 20px; }
    }
    @keyframes chibiSlideDown {
      from { bottom: 38px;  left: 20px; }
      to   { bottom: -160px; left: 20px; }
    }
    @keyframes chibiDropIn {
      from { top: -160px; }
      to   { top: 20px; }
    }
    @keyframes chibiDropOut {
      from { top: 20px; }
      to   { top: -160px; }
    }

    /* drop-in variant: repositioned absolutely at top-center */
    #chibi-mascot.chibi-mode-drop {
      left: 50%;
      transform: translateX(-50%);
      bottom: auto;
    }
    #chibi-mascot.chibi-mode-slide {
      left: 20px;
      bottom: -160px;
      top: auto;
      transform: none;
    }

    #chibi-img {
      width: 200px;
      height: 150px;
      object-fit: contain;
      object-position: bottom center;
      display: block;
    }

    #chibi-bubble {
      position: absolute;
      bottom: 140px;
      left: 10px;
      width: 220px;
      min-height: 44px;
      background: var(--surface);
      border: 1px solid var(--amber-dim);
      border-radius: 12px;
      padding: 10px 14px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--amber);
      letter-spacing: 0.02em;
      line-height: 1.5;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }
    /* little tail on bubble */
    #chibi-bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 28px;
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 8px solid var(--amber-dim);
    }
    #chibi-bubble.visible {
      opacity: 1;
    }
    /* drop-in bubble: show above chibi going into top */
    #chibi-mascot.chibi-mode-drop #chibi-bubble {
      bottom: auto;
      top: 140px;
      left: 50%;
      transform: translateX(-50%);
    }
    #chibi-mascot.chibi-mode-drop #chibi-bubble::after {
      bottom: auto;
      top: -8px;
      border-top: none;
      border-bottom: 8px solid var(--amber-dim);
    }
  </style>
</head>
<body>
<div class="app">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="sb-logo">PranshulOS</div>
    <nav class="sb-nav">
      <div class="sb-section">Pages</div>
      <button class="sb-btn" id="nav-home" onclick="navigate('home')">
        <span class="sb-icon">🏠</span> Home
      </button>
      <button class="sb-btn" id="nav-dashboard" onclick="navigate('dashboard')">
        <span class="sb-icon">📋</span> Dashboard
      </button>
      <button class="sb-btn" id="nav-docs" onclick="navigate('docs')">
        <span class="sb-icon">📝</span> Docs
      </button>
      <button class="sb-btn" id="nav-routine" onclick="navigate('routine')">
        <span class="sb-icon">🔁</span> Routine
      </button>
      <button class="sb-btn" id="nav-weekly-routine" onclick="navigate('weekly-routine')">
        <span class="sb-icon">📅</span> Weekly
      </button>
      <button class="sb-btn" id="nav-tickets" onclick="navigate('tickets')">
        <span class="sb-icon">🎫</span> Tickets
      </button>
    </nav>
    <div class="sb-ver">v2.3 · pranshulos</div>
  </aside>

  <!-- ── Main ── -->
  <main class="main">
    <div id="content"></div>
  </main>

</div>

<script>
// ── Navigation ──────────────────────────────────────────────────────────────
//
// Design: each page fragment exposes a single `window.__pageInit` function.
// shell.html calls it AFTER the DOM is appended, eliminating the rAF race and
// the stale-global problem (no guard flags survive across navigations because
// page scripts run fresh inside a Function scope every time).

let _currentPage = null;

async function navigate(page) {
  if (_currentPage === page) return;
  _currentPage = page;

  // Update sidebar active state
  document.querySelectorAll('.sb-btn[id^="nav-"]').forEach(b => b.classList.remove('active'));
  const navBtn = document.getElementById('nav-' + page);
  if (navBtn) navBtn.classList.add('active');

  const content = document.getElementById('content');

  try {
    const res  = await fetch('/' + page + '?fragment=1');
    const html = await res.text();

    // ── 1. Teardown previous page ──────────────────────────────────────────
    if (typeof window.__pageDestroy === 'function') {
      try { window.__pageDestroy(); } catch(_) {}
    }
    window.__pageInit    = null;
    window.__pageDestroy = null;

    content.innerHTML = '';
    content.classList.remove('fade-in');

    // ── 2. Parse fragment ──────────────────────────────────────────────────
    const parser = new DOMParser();
    const doc    = parser.parseFromString(html, 'text/html');

    // ── 3. Swap styles (removes previous page styles first) ────────────────
    document.querySelectorAll('style[data-page]').forEach(s => s.remove());
    doc.querySelectorAll('style').forEach(s => {
      const el = document.createElement('style');
      el.setAttribute('data-page', page);
      el.textContent = s.textContent;
      document.head.appendChild(el);
    });

    // ── 4. Mount DOM ───────────────────────────────────────────────────────
    const wrapper = document.createElement('div');
    wrapper.style.cssText = 'height:100%;display:flex;flex-direction:column;min-height:0;';
    doc.body.childNodes.forEach(node => {
      if (node.nodeName !== 'SCRIPT' && node.nodeName !== 'STYLE') {
        wrapper.appendChild(document.importNode(node, true));
      }
    });
    content.appendChild(wrapper);
    content.classList.add('fade-in');

    // ── 5. Execute scripts (DOM is already live at this point) ─────────────
    // Scripts run in order; they should set window.__pageInit instead of
    // calling init themselves. Shell calls __pageInit() below.
    const scriptTexts = [];
    doc.querySelectorAll('script').forEach(s => {
      if (s.src) {
        // external script — append normally (async, order not guaranteed)
        const el = document.createElement('script');
        el.src = s.src;
        document.head.appendChild(el);
      } else {
        scriptTexts.push(s.textContent);
      }
    });

    // Run inline scripts synchronously in order via Function so they share
    // no closure state with previous page loads.
    for (const src of scriptTexts) {
      try { new Function(src)(); } catch(e) { console.error('[navigate] script error on', page, e); }
    }

    // ── 6. Call the page's init hook now that DOM + scripts are both ready ─
    if (typeof window.__pageInit === 'function') {
      try { window.__pageInit(); } catch(e) { console.error('[navigate] __pageInit error on', page, e); }
    }

  } catch (e) {
    content.innerHTML =
      '<div style="padding:40px;font-family:monospace;color:#c87070;">Failed to load ' + page + ': ' + e.message + '</div>';
  }
}

// ── App launches ─────────────────────────────────────────────────────────────

async function launch(app) {
  try { await fetch('/launch/' + app); } catch(_) {}
}

// ── Init ─────────────────────────────────────────────────────────────────────

navigate('home');
</script>

<script>
(function() {
  // ── ChibiMascot: scalable, event-driven mascot system ──────────────────
  //
  // States are defined in CHIBI_STATES. Each state has:
  //   trigger  – what fires it ('timer_1min' | 'timer_5min' | custom)
  //   mode     – animation type: 'slide' (bottom-left) | 'drop' (top-center)
  //   messages – array of strings; one is picked at random each visit
  //   duration – how long (ms) chibi stays visible before retreating
  //
  // To add new reactions later: push a new object to CHIBI_STATES and
  // call ChibiMascot.trigger('your_custom_trigger') from anywhere.

  const CHIBI_STATES = [
    {
      id: 'lurk',
      trigger: 'timer_1min',
      mode: 'slide',
      messages: [
        "don't mind me, just watching 👀",
        "carry on… I'm just lurking 🕵️",
        "pretend I'm not here 🙈",
        "just your friendly neighbourhood chibi 🌙",
      ],
      duration: 15000,
    },
    {
      id: 'checkin',
      trigger: 'timer_5min',
      mode: 'drop',
      messages: [
        "hey, you doing okay up there? 👋",
        "just checking in on you ✨",
        "still grinding? respect 💪",
        "don't forget to blink 👁️",
      ],
      duration: 12000,
    },
  ];

  const mascot  = document.getElementById('chibi-mascot');
  const bubble  = document.getElementById('chibi-bubble');
  let _active   = false;
  let _retreatTimer = null;
  let _bubbleTimer  = null;

  function _pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function _clearTimers() {
    if (_retreatTimer) { clearTimeout(_retreatTimer); _retreatTimer = null; }
    if (_bubbleTimer)  { clearTimeout(_bubbleTimer);  _bubbleTimer  = null; }
  }

  function _removeAnimClasses() {
    mascot.classList.remove(
      'chibi-slide-up', 'chibi-slide-down',
      'chibi-drop-in',  'chibi-drop-out'
    );
  }

  function _show(state) {
    if (_active) return; // already visible — skip to avoid overlap
    _active = true;
    _clearTimers();

    const msg = _pick(state.messages);
    bubble.textContent = msg;
    bubble.classList.remove('visible');

    // Switch mode
    mascot.classList.remove('chibi-mode-slide', 'chibi-mode-drop');
    mascot.classList.add('chibi-mode-' + state.mode);

    // Reset position off-screen
    _removeAnimClasses();

    // Tiny delay so the class swap has taken effect before animating
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        mascot.classList.add(state.mode === 'drop' ? 'chibi-drop-in' : 'chibi-slide-up');

        // Show bubble after chibi finishes entering (500ms)
        _bubbleTimer = setTimeout(() => {
          bubble.classList.add('visible');
        }, 520);

        // Retreat after duration
        _retreatTimer = setTimeout(() => _hide(state), state.duration);
      });
    });
  }

  function _hide(state) {
    bubble.classList.remove('visible');
    _removeAnimClasses();

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        mascot.classList.add(state.mode === 'drop' ? 'chibi-drop-out' : 'chibi-slide-down');
        // Mark inactive after animation completes
        setTimeout(() => { _active = false; }, 450);
      });
    });
  }

  // Public API — trigger a state by ID or trigger name
  window.ChibiMascot = {
    trigger: function(triggerId) {
      const state = CHIBI_STATES.find(s => s.id === triggerId || s.trigger === triggerId);
      if (state) _show(state);
    },
    addState: function(stateDef) {
      // Allows external code to register new chibi states
      CHIBI_STATES.push(stateDef);
    },
  };

  // ── Scheduling ─────────────────────────────────────────────────────────
  // 5-min check-in takes priority; if it fires, the 1-min lurk is suppressed
  // for that cycle and the 1-min clock resets.

  let _lurk1min   = null;
  let _check5min  = null;
  let _lurk1Reset = false;

  function schedule1min() {
    _lurk1min = setTimeout(() => {
      if (!_active) {
        ChibiMascot.trigger('timer_1min');
      }
      schedule1min();
    }, 60 * 1000);
  }

  function schedule5min() {
    _check5min = setTimeout(() => {
      // 5-min is priority — clear pending 1-min and fire 5-min
      if (_lurk1min) { clearTimeout(_lurk1min); _lurk1min = null; }
      ChibiMascot.trigger('timer_5min');
      // Restart both clocks after 5-min chibi retreats (+buffer)
      const bufferAfterRetreat = 16000;
      setTimeout(() => {
        schedule1min();
        schedule5min();
      }, bufferAfterRetreat);
    }, 5 * 60 * 1000);
  }

  schedule1min();
  schedule5min();
})();
</script>
